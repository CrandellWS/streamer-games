<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wheel of Legends — postMessage API Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e8e8f0; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid #444; background: #2a2a4a; color: #e8e8f0; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a3a5a; }
  .log { background: #0d0d14; border: 1px solid #333; border-radius: 8px; padding: 12px; font: 12px monospace; height: 220px; overflow-y: auto; white-space: pre-wrap; }
  .pass { color: #44ff88; } .fail { color: #ff4466; } .info { color: #42a5f5; } .in { color: #ffd166; }
  iframe { border: 1px solid #444; border-radius: 8px; width: 100%; height: 560px; margin-top: 12px; }
</style>
</head>
<body>
<h1>Wheel of Legends — postMessage API Test Suite</h1>
<div class="row">
  <button onclick="send({type:'legends:add', names:['Alice','Bob','Charlie','Diana','Eve','Frank']})">Add 6 names</button>
  <button onclick="send({type:'legends:add', name:'Viewer' + Math.floor(Math.random()*1000)})">Add 1 name</button>
  <button onclick="send({type:'legends:names'})">Query names</button>
  <button onclick="send({type:'legends:mode', mode:'classic'})">Mode: Classic</button>
  <button onclick="send({type:'legends:mode', mode:'gauntlet'})">Mode: Gauntlet</button>
  <button onclick="send({type:'legends:start'})">Spin</button>
  <button onclick="send({type:'legends:charge', name:'Charger' + Math.floor(Math.random()*1000)})">Charge</button>
  <button onclick="send({type:'legends:reset'})">Reset round</button>
  <button onclick="send({type:'legends:clear'})">Clear</button>
</div>
<div class="row">
  <button onclick="pickBoth()">Duel: both finalists pick</button>
  <button onclick="claimWinner()">Winner claims</button>
  <button onclick="runAll()">Run API tests</button>
  <button onclick="frame.src='index.html?speed=4&names=Ann,Ben,Cat'">Reload ?names=&speed=4</button>
  <button onclick="frame.src='index.html?admin=false&bg=transparent&theme=neon'">Reload OBS mode</button>
</div>
<div class="log" id="log"></div>
<iframe id="frame" src="index.html?speed=4"></iframe>
<script>
const logEl = document.getElementById('log'), frame = document.getElementById('frame');
const log = (m, c = 'info') => { logEl.innerHTML += `<span class="${c}">[${new Date().toLocaleTimeString()}] ${m.replace(/</g, '&lt;')}</span>\n`; logEl.scrollTop = 1e9; };
const send = m => { log('→ ' + JSON.stringify(m)); frame.contentWindow.postMessage(m, '*'); };
let last = {}, finalists = [], winner = null;
addEventListener('message', e => {
  if (e.source !== frame.contentWindow || !e.data || !String(e.data.type).startsWith('legends:')) return;
  last[e.data.type] = e.data;
  if (e.data.type === 'legends:duel') finalists = e.data.finalists;
  if (e.data.type === 'legends:winner') winner = e.data.winner;
  log('← ' + JSON.stringify(e.data).slice(0, 300), 'in');
});
function pickBoth() { finalists.forEach((n, i) => send({ type: 'legends:pick', name: n, choice: i ? 'scissors' : 'rock' })); }
function claimWinner() { if (winner) send({ type: 'legends:claim', name: winner }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function ask() { delete last['legends:names']; send({ type: 'legends:names' }); await wait(200); return last['legends:names']; }
async function runAll() {
  const check = (ok, m) => log((ok ? 'PASS ' : 'FAIL ') + m, ok ? 'pass' : 'fail');
  send({ type: 'legends:reset' }); send({ type: 'legends:clear' }); await wait(200);
  check(((await ask()) || {}).names?.length === 0, 'clear empties the wheel');
  send({ type: 'legends:add', name: 'Alice' }); send({ type: 'legends:join', name: 'bob' }); send({ type: 'legends:add', name: 'ALICE' });
  send({ type: 'legends:add', names: ['Cara', 'Dee', 'cara'] }); await wait(200);
  const r = await ask();
  check(r && r.names.join() === 'Alice,bob,Cara,Dee', 'add/join with case-insensitive dedupe: ' + (r && r.names.join()));
  send({ type: 'legends:remove', name: 'dee' }); await wait(100);
  check((await ask()).names.length === 3, 'remove');
  send({ type: 'legends:mode', mode: 'classic' }); delete last['legends:result']; delete last['legends:winner'];
  send({ type: 'legends:start' });
  for (let i = 0; i < 60 && !last['legends:winner']; i++) await wait(250);
  const res = last['legends:result'], w = last['legends:winner'];
  check(!!res && /^[0-9a-f]{64}$/.test(res.seed) && /^[0-9a-f]{64}$/.test(res.seedCommit), 'legends:result carries seed + commit');
  check(!!w && res && res.names[res.index] === w.winner, 'winner is names[index]');
  if (res) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(res.seed)));
    check([...h].map(b => b.toString(16).padStart(2, '0')).join('') === res.seedCommit, 'SHA-256(seed) equals the sealed code');
  }
}
</script>
</body>
</html>
