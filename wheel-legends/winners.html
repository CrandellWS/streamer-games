<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Legends Winner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
/* Wheel of Legends winner tab: shows ?w=Name (&s=waiting|claimed|missed &m=classic|gauntlet &t=time) big and plain.
   The wheel opens this once (Winner tab button) and keeps it pointed at the latest winner.
   ?bg=transparent for an OBS browser source. */
:root { --bg0: #07060f; --bg1: #241a52; --card: #15112f; --ink: #f8f4ff; --muted: #b3a8dc; --gold: #ffcf4a; --green: #3ddc84; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { display: grid; place-items: center; text-align: center; padding: 16px; overflow: hidden;
  background: radial-gradient(ellipse at top, var(--bg1), var(--bg0)); color: var(--ink); font: 16px/1.4 'Segoe UI', system-ui, -apple-system, sans-serif; }
body.transparent { background: transparent; }
h1 { font-size: clamp(1.2rem, 4.5vw, 2.6rem); letter-spacing: .2em; margin-bottom: 18px;
  background: linear-gradient(100deg, #fff3c4, var(--gold), #ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.w { display: inline-block; font-size: clamp(2rem, 10vw, 6rem); font-weight: 900; padding: 8px 44px; border-radius: 999px; background: var(--card);
  border: 3px solid var(--gold); box-shadow: 0 0 34px rgba(255,207,74,.55); max-width: 94vw; overflow-wrap: anywhere; }
.w small { display: block; font-size: .28em; color: var(--muted); font-weight: 700; }
.w.claimed { border-color: var(--green); box-shadow: 0 0 34px rgba(61,220,132,.5); }
.w.claimed small { color: var(--green); }
.w.missed { opacity: .45; text-decoration: line-through; }
.wait { color: var(--muted); font-size: clamp(1.2rem, 4vw, 2rem); }
p { margin-top: 18px; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>🏆 WHEEL OF LEGENDS 🏆</h1>
  <div id="win"></div>
  <p id="at"></p>
</main>
<script>
(() => {
'use strict';
const q = new URLSearchParams(location.search);
if (q.get('bg') === 'transparent') document.body.classList.add('transparent');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const tag = { claimed: '✅ claimed', missed: '⌛ missed the claim timer', waiting: '✋ type !play claim in chat' };
const name = (q.get('w') || '').trim().slice(0, 40), st = q.get('s') || '';
document.getElementById('win').innerHTML = name
  ? `<div class="w ${esc(st)}">${esc(name)}${tag[st] ? `<small>${tag[st]}</small>` : ''}</div>`
  : '<div class="wait">Waiting for the next legend…</div>';
const m = q.get('m') === 'gauntlet' ? 'Gauntlet champion' : 'Classic winner';
if (q.get('t')) document.getElementById('at').textContent = (name ? m + ' · ' : '') + new Date(+q.get('t')).toLocaleString();
if (name) document.title = '🏆 ' + name;
})();
</script>
</body>
</html>
